<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9EAA"/>
      <stop offset="50%" stop-color="#FF6B8B"/>
      <stop offset="100%" stop-color="#E84370"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FFE4EC"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#E84370" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGrad)" stroke="#FFB6C1" stroke-width="4"/>

  <g filter="url(#softShadow)">
    <!-- Base palm hint -->
    <path d="M 140 420 Q 256 460 372 420 L 372 460 Q 256 490 140 460 Z" fill="#FF8DA1"/>
    
    <!-- Cute Pinky Finger Body -->
    <path d="M 210 430 
             L 210 160 
             A 46 46 0 0 1 302 160 
             L 302 430 
             Z" 
          fill="url(#pinkGrad)" stroke="#D42D5B" stroke-width="8" stroke-linejoin="round"/>

    <!-- Pinky Finger Top Bend/Curve -->
    <path d="M 226 120 Q 256 95 286 120" stroke="#FFC2CD" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Fingernail -->
    <path d="M 232 135 Q 256 120 280 135 Q 284 175 256 175 Q 228 175 232 135 Z" fill="#FFE2E8" stroke="#D42D5B" stroke-width="5"/>
    <!-- Nail shine -->
    <path d="M 242 140 Q 256 130 268 140" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Cute Big Eyes -->
    <circle cx="236" cy="235" r="14" fill="#1A1A1A"/>
    <circle cx="276" cy="235" r="14" fill="#1A1A1A"/>
    <!-- Eye highlights -->
    <circle cx="240" cy="231" r="5" fill="#FFFFFF"/>
    <circle cx="280" cy="231" r="5" fill="#FFFFFF"/>
    <circle cx="233" cy="239" r="2" fill="#FFFFFF"/>
    <circle cx="273" cy="239" r="2" fill="#FFFFFF"/>

    <!-- Blush cheeks -->
    <ellipse cx="222" cy="250" rx="9" ry="6" fill="#FF3366" opacity="0.45"/>
    <ellipse cx="290" cy="250" rx="9" ry="6" fill="#FF3366" opacity="0.45"/>

    <!-- Happy Smug Smile -->
    <path d="M 246 254 Q 256 266 266 254" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 265 253 Q 272 250 270 257" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Finger Knuckle Lines -->
    <path d="M 230 305 Q 256 312 282 305" stroke="#D42D5B" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 236 322 Q 256 327 276 322" stroke="#D42D5B" stroke-width="4" stroke-linecap="round" fill="none"/>

    <path d="M 228 375 Q 256 383 284 375" stroke="#D42D5B" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 234 390 Q 256 395 278 390" stroke="#D42D5B" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Tiny Pinky Promise Sparkle Stars -->
    <g transform="translate(325, 110) scale(0.9)">
      <path d="M 20 0 Q 20 20 40 20 Q 20 20 20 40 Q 20 20 0 20 Q 20 20 20 0 Z" fill="#FFD700"/>
    </g>
    <g transform="translate(150, 180) scale(0.65)">
      <path d="M 20 0 Q 20 20 40 20 Q 20 20 20 40 Q 20 20 0 20 Q 20 20 20 0 Z" fill="#FFD700"/>
    </g>
  </g>
</svg>
